<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartSpin2k Web Shifter</title>
  <style>html{background-color:#03245c}</style>
</head>
<body>
  <div class="page-container">
    <header>
      <nav aria-label="Main navigation">
        <a href="index.html" class="back-link" aria-label="Back to main menu">← Main Menu</a>
        <a href="http://github.com/doudar/SmartSpin2k" class="github-link">SmartSpin2k</a>
      </nav>
    </header>

    <main>
      <div id="loadingWatermark" class="watermark" aria-hidden="true">Loading</div>
      <h1 class="brand">Web Shifter</h1>

      <div class="shifter-container">
        <div class="shift-controls">
          <button type="button" id="shiftUp" onclick="sendShift(1)" class="shift-button shift-up" aria-label="Shift Up">
            <span class="shift-arrow">▲</span>
            <span class="shift-label">SHIFT UP</span>
          </button>

          <div class="gear-display">
            <label for="shiftBox" class="gear-label">Current Gear</label>
            <input type="text" id="shiftBox" class="gear-value" value="loading" readonly aria-live="polite">
          </div>

          <button type="button" id="shiftDown" onclick="sendShift(-1)" class="shift-button shift-down" aria-label="Shift Down">
            <span class="shift-arrow">▼</span>
            <span class="shift-label">SHIFT DOWN</span>
          </button>
        </div>

        <div class="rehome-controls">
          <button type="button" onclick="showRehomeConfirmation()" class="secondary-button">Rehome Stepper</button>
        </div>
      </div>

      
      <div id="rehomeStatus" class="status-message" role="status" aria-live="polite"></div>
      <dialog id="rehomeDialog" class="modal">
        <h2>Rehome Stepper Motor?</h2>
        <p>
            This will trigger a rehoming calibration. It can be useful to Rehome To Zero if 
            the stepper motor slips and loses alignment with the bike's resistance knob.
        </p>
        <div class="dialog-buttons">
          <button type="button" onclick="rehome('zero')" class="warning-button">To Zero</button>
          <button type="button" onclick="rehome('both')" class="secondary-button">Both Directions</button>
          <button type="button" onclick="hideRehomeConfirmation()" class="secondary-button">Cancel</button>
        </div>
      </dialog>
    </main>
  </div>

  <script>
    let updateTimer;
    const shiftBox = document.getElementById('shiftBox');
    
    function sendShift(direction) {
      const position = parseInt(shiftBox.value, 10);
      const newPosition = position + direction;
      
      // Optimistic UI update
      shiftBox.value = newPosition;
      
      // Visual feedback
      const button = direction > 0 ? 'shiftUp' : 'shiftDown';
      const elem = document.getElementById(button);
      elem.classList.add('active');
      setTimeout(() => elem.classList.remove('active'), 200);

      // Send request
      fetch('/shift?value=' + direction, { method: 'GET' })
        .catch(error => {
          console.error('Shift error:', error);
          shiftBox.value = position; // Revert on error
        });
    }

    const rehomeStatus = document.getElementById('rehomeStatus');
    const rehomeDialog = document.getElementById('rehomeDialog');

    function showRehomeConfirmation() {
      rehomeDialog.showModal();
    }
    function hideRehomeConfirmation() {
      rehomeDialog.close();
    }
    function rehome(value) {
      fetch('/home?value=' + value, { method: 'GET' })
        .then(() => {
          showRehomeStatus('Rehoming...', 'success');
          hideRehomeConfirmation();
        })
        .catch(error => showSaveStatus('Failed to rehome', 'error'));
    }
    function showRehomeStatus(message, type = 'info') {
      rehomeStatus.textContent = message;
      rehomeStatus.className = `status-message ${type}`;
      setTimeout(() => {
        rehomeStatus.textContent = '';
        rehomeStatus.className = 'status-message';
      }, 3000);
    }

    function startUpdate() {
      if (!updateTimer) {
        updateTimer = setInterval(requestConfigValues, 3000);
      }
    }

    function requestConfigValues() {
      fetch('/runtimeConfigJSON')
        .then(response => response.json())
        .then(data => {
          shiftBox.value = data.shifterPosition;
          document.getElementById('loadingWatermark')?.remove();
        })
        .catch(() => startUpdate());
    }

    function loadCss() {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'style.css';
      document.head.appendChild(link);
    }

    window.addEventListener('load', () => {
      setTimeout(loadCss, 100);
      setTimeout(requestConfigValues, 500);
      startUpdate();
    });
  </script>
</body>
</html>
